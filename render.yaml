services:
  # FastAPI Backend Web Service
  - type: web
    name: rlhf-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: INFO

  # React + Vite Frontend Static Site
  - type: web
    name: rlhf-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rlhf-backend
          property: host
